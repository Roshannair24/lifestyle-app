services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-padosi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-padosi}
      POSTGRES_DB: ${POSTGRES_DB:-padosi}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"   # inbox UI: http://localhost:8025
      - "1025:1025"   

  # api:
  #   build: ./pp-server          # uses pp-server/Dockerfile
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     DATABASE_URL: postgres://${POSTGRES_USER:-padosi}:${POSTGRES_PASSWORD:-padosi}@db:5432/${POSTGRES_DB:-padosi}
  #   depends_on:
  #     db:
  #       condition: service_healthy

volumes:
  pgdata: